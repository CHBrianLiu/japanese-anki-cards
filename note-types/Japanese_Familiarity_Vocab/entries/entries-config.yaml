notetype: Japanese_Familiarity_Vocab

# Ordered ordinary Fields and legacy CSV columns. Tags is native Note metadata,
# not an ordinary Field; its column is retained for the CSV import workflow.
# - Order here determines CSV column order.
# - The first field is always the ID field used for idempotent imports;
#   it must never be empty in any entry.
# - required: true  -> tool aborts if any entry is missing this field or has it empty.
# - required: false -> tool allows empty/absent values; outputs an empty CSV column.
fields:
  - name: WordID
    required: true
  - name: DisplayWord
    required: true
  - name: Reading
    required: false
  - name: Meaning
    required: false
  - name: UsageLabel
    required: false
  - name: Example
    required: false
  - name: Source
    required: false
  - name: Notes
    required: false
  - name: Tags
    required: false
