notetype: Japanese_Listening

# Ordered ordinary Fields and legacy CSV columns. Tags is native Note metadata,
# not an ordinary Field; its column is retained for the CSV import workflow.
fields:
  - name: ListeningID
    required: true
  - name: Audio
    required: true
  - name: JapaneseSentence
    required: true
  - name: Reading
    required: false
  - name: Notes
    required: false
  - name: Source
    required: false
  - name: Tags
    required: false
